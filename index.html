<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindMate - เพื่อนรับฟังคุณ</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลดไฟล์ CSS ของเรา -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="custom-bg min-h-screen flex items-center justify-center p-4">
    <div
      class="w-full max-w-2xl glass-panel rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[85vh]"
    >
      <!-- Header -->
      <div
        class="glass-header p-5 text-white flex justify-between items-center border-b border-white/20"
      >
        <div>
          <h1 class="text-xl font-bold flex items-center gap-2 drop-shadow-md">
            🌱 MindMate
          </h1>
          <p class="text-sm text-sky-50 drop-shadow-sm">
            เพื่อนที่พร้อมโอบกอดและรับฟังคุณเสมอ
          </p>
        </div>
        <a
          href="tel:1323"
          class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 flex items-center gap-2 rounded-full text-sm font-medium transition-colors hidden shadow-lg"
          id="crisisAlert"
        >
          📞 สายด่วน 1323
        </a>
      </div>

      <!-- Chat Box -->
      <div id="chatBox" class="flex-1 overflow-y-auto p-5 space-y-4 chat-bg">
        <!-- ข้อความต้อนรับ -->
        <div class="flex gap-3">
          <div
            class="w-8 h-8 rounded-full bg-sky-500 flex items-center justify-center text-white text-sm shrink-0 shadow-md"
          >
            🌱
          </div>
          <div
            class="bg-white/90 backdrop-blur-sm border border-white/50 text-gray-700 rounded-2xl rounded-tl-none px-5 py-3 shadow-sm max-w-[80%] leading-relaxed"
          >
            สวัสดีครับ วันนี้เป็นยังไงบ้าง? มีเรื่องหนักใจ
            หรืออยากระบายอะไรให้เราฟัง พิมพ์มาได้เลยนะ เราอยู่ตรงนี้เสมอ 💙
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="p-5 glass-footer border-t border-white/30">
        <form id="chatForm" class="flex gap-3">
          <input
            type="text"
            id="userInput"
            class="flex-1 border-0 rounded-full px-5 py-3 focus:outline-none focus:ring-2 focus:ring-teal-400 bg-white/80 backdrop-blur-sm shadow-inner"
            placeholder="พิมพ์ความรู้สึกในใจของคุณตรงนี้..."
            required
          />
          <button
            type="submit"
            class="bg-teal-500 hover:bg-teal-600 text-white px-6 py-3 rounded-full font-medium transition-all transform hover:-translate-y-1 shadow-md"
          >
            ส่งข้อความ
          </button>
        </form>
      </div>
    </div>

    <!-- โหลดไฟล์ JavaScript ของเรา -->
    <script src="script.js"></script>
  </body>
</html>
