<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindMate - เพื่อนรับฟังคุณ</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-sky-50/50 min-h-screen flex items-center justify-center p-4">
    <div
      class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col h-[80vh]"
    >
      <!-- Header -->
      <div class="bg-sky-500 p-4 text-white flex justify-between items-center">
        <div>
          <h1 class="text-xl font-bold flex items-center gap-2">🌱 MindMate</h1>
          <p class="text-sm text-sky-100">
            เพื่อนที่พร้อมโอบกอดและรับฟังคุณเสมอ
          </p>
        </div>
        <a
          href="tel:1323"
          class="bg-red-500 hover:bg-red-600 text-white px-4 py-1 flex items-center gap-2 rounded-full text-sm font-medium transition-colors hidden"
          id="crisisAlert"
        >
          📞 สายด่วน 1323
        </a>
      </div>

      <!-- Chat Box -->
      <div
        id="chatBox"
        class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50"
      >
        <!-- ข้อความต้อนรับ -->
        <div class="flex gap-3">
          <div
            class="w-8 h-8 rounded-full bg-sky-500 flex items-center justify-center text-white text-sm shrink-0"
          >
            🌱
          </div>
          <div
            class="bg-white border border-sky-100 text-gray-700 rounded-2xl rounded-tl-none px-4 py-2 shadow-sm max-w-[80%]"
          >
            สวัสดีครับ วันนี้เป็นยังไงบ้าง? มีเรื่องหนักใจ
            หรืออยากระบายอะไรให้เราฟัง พิมพ์มาได้เลยนะ เราอยู่ตรงนี้เสมอ 💙
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="p-4 bg-white border-t border-sky-100">
        <form id="chatForm" class="flex gap-2">
          <input
            type="text"
            id="userInput"
            class="flex-1 border border-sky-200 rounded-full px-4 py-2 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 bg-sky-50/30"
            placeholder="พิมพ์ความรู้สึกในใจของคุณตรงนี้..."
            required
          />
          <button
            type="submit"
            class="bg-sky-500 hover:bg-sky-600 text-white px-6 py-2 rounded-full font-medium transition-colors shadow-sm"
          >
            ส่งข้อความ
          </button>
        </form>
      </div>
    </div>

    <script>
      const chatForm = document.getElementById("chatForm");
      const userInput = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const crisisAlert = document.getElementById("crisisAlert");

      let conversationHistory = [];
      // สร้าง Session ID แบบสุ่มสำหรับจำผู้ใช้ในรอบนี้
      const currentSessionId =
        "session_" + Math.random().toString(36).substr(2, 9);

      function addMessage(sender, text) {
        const div = document.createElement("div");
        div.className =
          sender === "user" ? "flex gap-3 justify-end" : "flex gap-3";

        const bubbleStr =
          sender === "user"
            ? `<div class="bg-teal-500 text-white rounded-2xl rounded-tr-none px-4 py-2 shadow-sm max-w-[80%]">${text}</div>`
            : `<div class="w-8 h-8 rounded-full bg-sky-500 flex items-center justify-center text-white text-sm shrink-0">🌱</div>
                   <div class="bg-white border border-sky-100 text-gray-700 rounded-2xl rounded-tl-none px-4 py-2 shadow-sm max-w-[80%]">${text}</div>`;

        div.innerHTML = bubbleStr;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text) return;

        addMessage("user", text);
        userInput.value = "";

        const userMsg = { role: "user", content: text };
        conversationHistory.push(userMsg);

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: conversationHistory,
              sessionId: currentSessionId,
              userMessage: text,
            }),
          });

          const data = await response.json();
          addMessage("assistant", data.reply);
          conversationHistory.push({ role: "assistant", content: data.reply });

          if (
            data.assessment &&
            (data.assessment.requiresEmergency ||
              data.assessment.severity === "Severe")
          ) {
            crisisAlert.classList.remove("hidden");
          }
        } catch (err) {
          addMessage(
            "assistant",
            "ขออภัยครับ เหมือนสัญญาณการเชื่อมต่อจะมีปัญหาเล็กน้อย",
          );
        }
      });
    </script>
  </body>
</html>
